[package]
name = "redis-tui"
version = "1.3.3"
edition = "2021"
description = "A Redis TUI client inspired by Redis Insight"
license = "BSD-3-Clause"

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29"
redis = "1.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
rustfft = "6"
