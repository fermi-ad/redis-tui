name: CI

on:
  # Scoped to main deliberately. Firing on every branch push as well meant a PR
  # branch triggered both `push` and `pull_request`, running the whole job twice;
  # de-duplicating them via `concurrency` fixed the waste but left the cancelled
  # run reported as a failed check, which showed the PR as UNSTABLE with nothing
  # actually wrong. Branch work is covered by the `pull_request` run, and main is
  # covered here after merge.
  push:
    branches: [main]
  # Deliberately unfiltered by base branch: a stacked PR targets its parent
  # branch rather than main, and filtering on `branches: [main]` would leave it
  # with no CI at all. There is no duplicate-run risk, since push is scoped above.
  pull_request:
  workflow_dispatch:

# Successive pushes to the same PR branch supersede each other. Keyed on the
# branch rather than `github.ref`, since the two events report different refs for
# the same branch (`refs/heads/<branch>` vs `refs/pull/<n>/merge`).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Rust, clippy and rustfmt are preinstalled on GitHub-hosted ubuntu runners,
      # so no toolchain action is needed. Print the versions so a runner image
      # update that changes behaviour is visible in the log.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The live tests spawn their own throwaway servers on OS-assigned ports via
      # the TestRedis harness, so only the binary needs to be on PATH - no service
      # container and no port configuration.
      - name: Install redis-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          redis-server --version

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ---- Hard gates: these are green on main today and must stay green ----

      - name: Build (debug)
        run: cargo build --locked --all-targets

      - name: Build (release)
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked

      - name: Test (live Redis)
        run: cargo test --locked -- --ignored

      # Clippy is enforced: the tree is at zero warnings and stays there.
      - name: Clippy
        id: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Enforced: the tree is formatted and stays that way. The bulk reformat is
      # listed in .git-blame-ignore-revs so it does not pollute git blame.
      - name: Format check
        id: fmt
        run: cargo fmt --check

      - name: Lint summary
        if: always()
        run: |
          {
            echo "### Lint status"
            echo
            echo "| Check | Result | Enforced |"
            echo "| ----- | ------ | -------- |"
            echo "| Clippy | ${{ steps.clippy.outcome }} | yes |"
            echo "| Format | ${{ steps.fmt.outcome }} | yes |"
            echo
            echo "All checks are enforced: build, tests, clippy and format."
            echo "The Docker image is built by the separate \`docker-build\` job."
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds the image without pushing, so a broken Dockerfile fails the pull
  # request. Previously nothing built it before merge - `docker-publish.yml`
  # only fires on push to main - so the publish job was the first thing that
  # would notice, by which point the break was already on main.
  #
  # Separate job rather than a step in build-and-test: it runs in parallel and
  # shows up as its own check. No registry credentials are involved; this never
  # pushes.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `--target`, so this builds the final `publish` stage - the same thing
      # docker-publish.yml builds and ships.
      - name: Build image
        run: docker build --platform linux/amd64 -t redis-tui:ci .

      - name: Image summary
        run: |
          {
            echo "### Docker image"
            echo
            echo "Built, not pushed."
            echo
            echo '```'
            docker image ls redis-tui:ci --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Advisory scan against the RustSec database.
  #
  # Dependabot is not a substitute. RUSTSEC-2026-0253 - a use-after-free in
  # `lru`, reachable here through ratatui's render path - is not mirrored in
  # GitHub's advisory database, so the repo reported zero open Dependabot
  # alerts the whole time that advisory was live in Cargo.lock. The RustSec DB
  # sees advisories GitHub's does not, and nothing in CI consulted it.
  #
  # Separate job so it reports as its own check and does not slow the build.
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cargo-audit is not preinstalled on the runner image and takes a couple
      # of minutes to compile, so the built binary is cached on its own key.
      # Bump the version in the key when bumping the version below.
      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version ^0.22

      # Vulnerabilities fail by default, but that default alone would not have
      # caught either advisory this job was added for: RUSTSEC-2026-0190 (anyhow)
      # and RUSTSEC-2026-0253 (lru) are both classified `unsound`, and plain
      # `cargo audit` exits 0 on them. Verified against the pre-update lockfile -
      # without `--deny unsound` the gate is a no-op here. `yanked` is promoted
      # for the same reason. `unmaintained` is left as a warning deliberately: it
      # fires on transitive crates that cannot be fixed from here, and
      # hard-failing on it would train people to ignore CI.
      #
      # Do not pin cargo-audit below 0.22: 0.21 cannot parse the CVSS 4.0 vectors
      # now present in the RustSec database and fails to load it at all, which
      # looks like a scan failure rather than a tooling one.
      - name: Audit
        run: cargo audit --deny unsound --deny yanked

      - name: Audit summary
        if: always()
        run: |
          {
            echo "### Advisory audit"
            echo
            echo "Source: RustSec advisory database (\`cargo audit\`)."
            echo "Vulnerabilities, unsound and yanked crates fail the build;"
            echo "unmaintained crates are reported as warnings only."
          } >> "$GITHUB_STEP_SUMMARY"
