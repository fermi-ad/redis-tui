name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to a PR branch triggers both `push` and `pull_request`. Superseded runs
# on the same ref are cancelled rather than left to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust, clippy and rustfmt are preinstalled on GitHub-hosted ubuntu runners,
      # so no toolchain action is needed. Print the versions so a runner image
      # update that changes behaviour is visible in the log.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The live tests spawn their own throwaway servers on OS-assigned ports via
      # the TestRedis harness, so only the binary needs to be on PATH - no service
      # container and no port configuration.
      - name: Install redis-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          redis-server --version

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ---- Hard gates: these are green on main today and must stay green ----

      - name: Build (debug)
        run: cargo build --locked --all-targets

      - name: Build (release)
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked

      - name: Test (live Redis)
        run: cargo test --locked -- --ignored

      # Clippy is enforced: the tree is at zero warnings and stays there.
      - name: Clippy
        id: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # ---- Ratchet: reported, not enforced ----
      #
      # main still carries ~198 pre-existing rustfmt diffs that belong to no single
      # change. Enforcing now would make CI red on every PR regardless of its
      # contents, and reformatting the tree would bury real diffs in noise.
      #
      # To enforce, run `cargo fmt` in a commit of its own, add that SHA to
      # .git-blame-ignore-revs, and delete the `continue-on-error` below. See #64.

      - name: Format check (reported, not enforced)
        id: fmt
        continue-on-error: true
        run: cargo fmt --check

      - name: Lint debt summary
        if: always()
        run: |
          {
            echo "### Lint status"
            echo
            echo "| Check | Result | Enforced |"
            echo "| ----- | ------ | -------- |"
            echo "| Clippy | ${{ steps.clippy.outcome }} | yes |"
            echo "| Format | ${{ steps.fmt.outcome }} | no |"
            echo
            echo "Build, tests and clippy are enforced. Format is reported only"
            echo "while the pre-existing rustfmt debt is cleared - see issue #64."
          } >> "$GITHUB_STEP_SUMMARY"
