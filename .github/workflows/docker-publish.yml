name: Build and Push Docker Image

# Publish only after CI has actually passed for the commit being published.
#
# This previously fired directly on `push: branches: [main]` with no `needs:`
# and no `workflow_run:`, so it ran *in parallel* with the main-push CI run
# rather than after it. A merge that broke the build still published `:latest`
# and `:<version>` to Harbor, and the publish was frequently the thing that
# finished first. Branch protection now keeps most breakage off main, but an
# admin bypass or a merge that goes red only on main would still have shipped.
#
# The coupling is by workflow *name*: renaming the CI workflow silently stops
# publishing. Keep the name here in step with `name:` in ci.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One publish at a time, and queued rather than cancelled. Two merges landing
# close together used to race their `:latest` pushes with no ordering at all, so
# `:latest` could end up on the older image. Queueing means the later commit
# pushes last and wins; cancelling in progress could instead abandon a push
# part-way through.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: adregistry.fnal.gov
  IMAGE: adregistry.fnal.gov/instrumentation/redis-tui

jobs:
  build-and-push:
    # `workflow_run` fires on *completion*, whatever the outcome, so the
    # conclusion has to be tested explicitly - without this the gate would be
    # decorative. Restricted to CI runs triggered by a push as well, so that
    # manually re-running CI on main does not republish; dispatch this workflow
    # directly for that. A manual dispatch here carries no `workflow_run`
    # context and is allowed through on its own terms.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')

    # A cloud runner is enough. An earlier revision of this workflow moved the
    # job to the self-hosted `adlinux3` on the theory that Harbor only grants
    # push from inside the FNAL network - that was wrong. Publishing was failing
    # because the credentials were interpolated into the shell (see the login
    # step below), and both runners publish fine once that is fixed.
    #
    # `redis-pvxs-ioc` runs its registry jobs on `adlinux3`; switching for
    # consistency with it would be reasonable, but is not required here.
    runs-on: ubuntu-latest

    steps:
      # For `workflow_run`, GITHUB_SHA and GITHUB_REF point at the tip of the
      # default branch rather than at the commit that triggered CI. Publishing
      # what CI actually tested means taking both from the event payload.
      - name: Resolve the commit being published
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      # actions/checkout v7 refuses to check out fork pull request code from a
      # `workflow_run` or `pull_request_target` workflow, and that guard runs
      # here rather than being skipped, because it is skipped only for a default
      # self-checkout with no explicit `ref` - this one sets `ref`.
      #
      # It passes for two independent reasons, both worth recording so nobody
      # has to re-derive them. The guard returns early unless
      # `workflow_run.event` starts with "pull_request", and the job condition
      # above already restricts this to `event == 'push'`. Even without that,
      # its fork test compares `workflow_run.head_repository.id` against
      # `repository.id`, which are equal for a push to this repo.
      #
      # So `allow-unsafe-pr-checkout` is deliberately NOT set. If this job is
      # ever widened to publish from pull request runs, that analysis stops
      # holding and the guard will correctly start failing the job.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.src.outputs.sha }}

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ steps.src.outputs.branch }}" != "main" ]; then
            # Branch-suffixed tags keep dispatch runs off :latest.
            BRANCH=$(echo "${{ steps.src.outputs.branch }}" | sed 's|/|-|g')
            echo "primary=${IMAGE}:${VERSION}-${BRANCH}" >> "$GITHUB_OUTPUT"
            echo "moving=${IMAGE}:latest-${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "primary=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "moving=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      # Plain docker login/build/push rather than buildx and
      # docker/build-push-action - the same commands redis-pvxs-ioc uses, and
      # they do not assume buildx is set up on the self-hosted runner.
      # Secrets are passed through env: rather than ${{ }} interpolation. GitHub
      # substitutes an expression as literal text into the script, so a Harbor
      # robot name - which contains a '$' - gets word-expanded by bash before
      # docker ever sees it: "robot$instrumentation+redis-tui" becomes
      # "robot+redis-tui", and Harbor rejects it. An env var is passed as data
      # and is never re-parsed by the shell.
      - name: Registry login
        env:
          USERNAME: ${{ secrets.ADREGISTRY_INST_USERNAME }}
          SECRET: ${{ secrets.ADREGISTRY_INST_SECRET }}
        run: |
          printf '%s' "$SECRET" \
            | docker login "$REGISTRY" \
                --username "$USERNAME" \
                --password-stdin

      - name: Build and push
        run: |
          PRIMARY="${{ steps.tags.outputs.primary }}"
          MOVING="${{ steps.tags.outputs.moving }}"

          docker build --platform linux/amd64 -t "$PRIMARY" -t "$MOVING" .
          docker push "$PRIMARY"
          docker push "$MOVING"

          DIGEST_REF="$(docker image inspect "$PRIMARY" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -F "${IMAGE}@sha256:" | head -n 1)"
          {
            echo "### Published"
            echo
            echo "- \`$PRIMARY\`"
            echo "- \`$MOVING\`"
            echo "- Digest: \`${DIGEST_REF:-unknown}\`"
            echo "- Commit: \`${{ steps.src.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker logout
        if: always()
        run: docker logout "$REGISTRY"
